<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>木雅藏语AI助手</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E" />
  <!-- 路径感知的启动背景：只在网站根地址使用米白色，
       /chat、/wisdom-space 等其他页面刷新时继续使用原来的深蓝色。 -->
  <script>
    (function () {
      try {
        var path = location.pathname.replace(/\/{2,}/g, '/');
        var isLanding = path === '/' || path === '/index.html';
        var s = document.createElement('style');
        s.textContent = isLanding
          ? 'html,body,#root{background-color:#f8f5f0!important}#boot-screen{opacity:1!important;visibility:visible!important}'
          : 'html,body,#root{background-color:#0a0e27!important}#boot-screen{display:none!important}';
        (document.head || document.documentElement).appendChild(s);
      } catch (e) { /* 异常时回退默认行为，不影响功能 */ }
    })();
  </script>
  <style>
    /* ===== 静态启动屏：在 React bundle 下载期间立即显示，挂载后自动被替换 ===== */
    #boot-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8f5f0;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      z-index: 2147483647;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.18s ease;
    }
    #boot-screen.is-visible {
      opacity: 1;
      visibility: visible;
    }
    #boot-screen.boot-screen--leaving {
      opacity: 0 !important;
      visibility: hidden !important;
      transition: opacity 0.32s ease, visibility 0s linear 0.32s;
    }
    #boot-screen .boot-ring {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #boot-screen .boot-ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(154, 59, 28, 0.15);
      border-top-color: #9a3b1c;
      animation: bootSpin 1.1s linear infinite;
    }
    #boot-screen .boot-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #9a3b1c;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(154, 59, 28, 0.35);
    }
    #boot-screen .boot-title {
      margin-top: 22px;
      font-size: 20px;
      font-weight: 700;
      color: #2c1810;
      letter-spacing: 1px;
    }
    #boot-screen .boot-status {
      margin-top: 10px;
      font-size: 13px;
      color: #8b7355;
      transition: color 0.4s;
    }
    #boot-screen .boot-percent {
      display: inline-block;
      min-width: 36px;
      margin-left: 4px;
      color: #9a3b1c;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    #boot-screen .boot-bar {
      margin-top: 24px;
      width: min(300px, 70vw);
      height: 6px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }
    #boot-screen .boot-bar-inner {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #9a3b1c, #c4a882);
      transition: width 0.22s ease-out;
    }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
  </style>
  <!-- 入口必须是 /src/main.tsx（Vite 标准入口）。
       注意：以前这里硬编码 /assets/index-C-3gSro2.js（一个 8 月冻结的预构建 bundle），
       导致 vite build 只"搬运"旧 bundle（5 modules transformed），src/ 源码完全不参与编译，
       改 LandingPage.tsx 等源码永远不生效。CSS 由 main.tsx 的 import 自动注入，无需手写 link。 -->
  <script type="module" src="/src/main.tsx"></script>
</head>
<body>
  <div id="root"></div>
  <div id="boot-screen">
    <div class="boot-ring">
      <div class="boot-logo">木</div>
    </div>
    <div class="boot-title">木雅藏语AI助手</div>
    <div class="boot-status" id="boot-status">
      <span id="boot-status-label">正在加载应用</span>
      <span class="boot-percent" id="boot-percent">0%</span>
    </div>
    <div class="boot-bar"><div class="boot-bar-inner"></div></div>
  </div>
  <script>
    // 模块脚本下载期间先显示平滑的阶段进度；React 启动后会按关键资源
    // 的实际完成情况推进到 70%、85%、100%。
    (function () {
      var path = location.pathname.replace(/\/{2,}/g, '/');
      if (path !== '/' && path !== '/index.html') return;
      var progress = 0;
      window.__setBootProgress = function (value, label) {
        progress = Math.max(progress, Math.min(100, Math.round(value)));
        var bar = document.querySelector('#boot-screen .boot-bar-inner');
        var percent = document.getElementById('boot-percent');
        var statusLabel = document.getElementById('boot-status-label');
        if (bar) bar.style.width = progress + '%';
        if (percent) percent.textContent = progress + '%';
        if (label && statusLabel) statusLabel.textContent = label;
      };
      window.__setBootProgress(4);
      window.__bootProgressTimer = window.setInterval(function () {
        if (progress >= 65) return;
        var step = Math.max(1, Math.ceil((65 - progress) * 0.09));
        window.__setBootProgress(Math.min(65, progress + step));
      }, 140);
    })();
    // 弱网提示：bundle 下载超过 10 秒仍未完成时，告知用户可能是网络/隧道慢，
    // 避免用户面对加载屏不知发生了什么。
    window.setTimeout(function () {
      var label = document.getElementById('boot-status-label');
      if (label) {
        label.textContent = '网络较慢，仍在加载';
        label.parentElement.style.color = '#b45309';
      }
    }, 10000);
  </script>
</body>
</html>
